# .github/workflows/run-rust-plugin.yml
name: "Run Rust Server Plugin"

# Avoid overlapping runs
concurrency:
  group: "rust-plugin-runner"
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours UTC

permissions:
  contents: read
  actions: write

env:
  RUST_SERVER_DIR: $HOME/rust_server
  PLUGIN_NAME: StringPoolDumper
  PLUGIN_AUTHOR: RustGPT
  PLUGIN_VERSION: "1.0.0"

jobs:
  run-plugin:
    name: "Rust Server Plugin Runner"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v3

      - name: "Download Installer Script (for reference/potential future use)"
        id: installer_download
        run: |
          curl -sL \
            https://raw.githubusercontent.com/publicrust/rust-server-setup/main/install_rust_server.sh \
            -o install_rust_server.sh
          chmod +x install_rust_server.sh
          echo "Installer script downloaded, but will not be executed directly."
          # We assume steamcmd setup happens here or is already present

      - name: "Ensure Directories Exist"
        run: |
          mkdir -p "$HOME/steamcmd"
          mkdir -p "$RUST_SERVER_DIR"

      - name: "Install/Update Rust Server via SteamCMD"
        run: |
          echo "Running SteamCMD to install/update Rust server..."
          # Assuming steamcmd is available at $HOME/steamcmd/steamcmd.sh
          # If not, the original script's download/extract logic needs to be run first
          # Check if steamcmd exists, basic check
          if [ ! -f "$HOME/steamcmd/steamcmd.sh" ]; then
             echo "Downloading SteamCMD..."
             cd "$HOME/steamcmd"
             wget -q "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz"
             tar -xvzf steamcmd_linux.tar.gz
             rm steamcmd_linux.tar.gz
             echo "SteamCMD downloaded."
          fi

          "$HOME/steamcmd/steamcmd.sh" +login anonymous +force_install_dir "$RUST_SERVER_DIR" +app_update 258550 +quit
          echo "SteamCMD finished."
          echo "Listing contents of $RUST_SERVER_DIR after steamcmd:"
          ls -la "$RUST_SERVER_DIR"

      - name: "Verify RustDedicated Executable"
        run: |
          if [ ! -f "$RUST_SERVER_DIR/RustDedicated" ]; then
            echo "::error::RustDedicated executable not found in $RUST_SERVER_DIR after SteamCMD run!"
            exit 1
          fi
          echo "RustDedicated found."

      - name: "Install/Update Oxide (uMod)"
        run: |
          echo "Installing Oxide..."
          cd "$RUST_SERVER_DIR"
          wget -q -O oxide.zip "https://umod.org/games/rust/download/develop"
          unzip -o oxide.zip
          rm oxide.zip
          echo "Oxide installed."

      - name: "Create start.sh Script"
        run: |
          echo "Creating start.sh..."
          cat > "$RUST_SERVER_DIR/start.sh" <<EOL
          #!/bin/bash
          set -e
          cd "\\$(dirname "\\$0")" # Ensure script runs from its directory
          ./RustDedicated -batchmode -nographics \\
          +server.port 28015 \\
          +server.hostname "My Rust Server" \\
          +server.identity "my_server" \\
          +server.maxplayers 50 \\
          +server.worldsize 1000 \\
          +server.seed 12345 \\
          +server.saveinterval 300 \\
          +server.secure 1 \\
          +server.description "Welcome to my Rust server!" \\
          +server.tickrate 30
          EOL
          chmod +x "$RUST_SERVER_DIR/start.sh"
          echo "start.sh created in $RUST_SERVER_DIR."

      - name: "Generate ${PLUGIN_NAME} Plugin"
        run: |
          PLUGIN_PATH="$RUST_SERVER_DIR/oxide/plugins/${PLUGIN_NAME}.cs"
          mkdir -p "$(dirname "$PLUGIN_PATH")"
          cat << EOF > "$PLUGIN_PATH"
          using Oxide.Core;
          namespace Oxide.Plugins {
              [Info("${PLUGIN_NAME}", "${PLUGIN_AUTHOR}", "${PLUGIN_VERSION}")]
              [Description("Dumps StringPool.toNumber dictionary and shuts down the server")]
              public class ${PLUGIN_NAME} : RustPlugin {
                  private const string FileName = "stringpool_dump.json";
                  private void OnServerInitialized(bool initial) {
                      Puts("Server initialized, starting dump...");
                      DumpStringPool();
                  }
                  private void DumpStringPool() {
                      _ = StringPool.Get(string.Empty);
                      Interface.Oxide.DataFileSystem.WriteObject(FileName, StringPool.toNumber);
                      Puts($"StringPool dumped to {FileName}");
                      Server.Command("quit", "Shutdown initiated by dump plugin");
                      Puts("Quit command issued.");
                  }
              }
          }
          EOF

      - name: "Link SteamClient Library"
        run: |
          mkdir -p ~/.steam/sdk64
          ln -sf "$HOME/steamcmd/linux64/steamclient.so" ~/.steam/sdk64/steamclient.so

      - name: "Start Rust Server"
        run: |
          cd "$RUST_SERVER_DIR"
          nohup ./start.sh > server_console.log 2>&1 &
          echo $! > server.pid
          sleep 15

      - name: "Verify Server Process"
        run: |
          ps aux | grep '[R]ustDedicated' || exit 1

      - name: "Await StringPool Dump File"
        run: |
          timeout 300 bash -c 'until [ -f "$RUST_SERVER_DIR/oxide/data/stringpool_dump.json" ]; do sleep 5; done'

      - name: "Display Logs"
        if: always()
        run: |
          echo "## Server Console Log"
          cat "$RUST_SERVER_DIR/server_console.log" || true
          echo "## Oxide Log Directory"
          ls -la "$RUST_SERVER_DIR/oxide/logs" || true
          echo "## Last 200 Lines of Oxide Logs"
          tail -n 200 "$RUST_SERVER_DIR/oxide/logs/"*.log || true

      - name: "Upload StringPool Dump Artifact"
        uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: stringpool-dump
          path: ${{ env.RUST_SERVER_DIR }}/oxide/data/stringpool_dump.json
